<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090909">
  <link rel="icon" href="../../service/lp/images/favicon.ico">
  <title>ZEROラボ｜新メインビジュアル A案</title>
  <link rel="preconnect" href="https://morisawafonts.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&amp;display=swap">
  <link rel="stylesheet" href="https://morisawafonts.net/c/01M4BM2NTN3DGZBTPFB0NSJDMZ/mf.css">
  <link rel="stylesheet" href="../../zero-labo-media/zero-morisawa-font.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="https://zero-s.jp/labo/" aria-label="ZEROラボ ホーム"><img src="../../service/lp/images/logo-w.svg" alt="" width="75" height="71"><span>ZEROラボ</span></a>
      <nav class="nav" id="primary-nav" aria-label="メインナビゲーション">
        <a href="https://zero-s.jp/labo/">ホーム</a>
        <a href="https://zero-s.jp/labo/?cat=2">LPO対策</a>
        <a href="https://zero-s.jp/labo/?cat=4">SEO対策</a>
        <a href="https://zero-s.jp/labo/?cat=3">メディア運営</a>
        <a href="https://zero-s.jp/labo/?page_id=7796">WEB用語集</a>
        <a class="contact" href="https://zero-s.jp/contact/"><svg viewBox="0 0 30 22" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="19" rx="1"/><path d="M3 3.5 15 13l12-9.5"/></svg>お問い合わせ</a>
      </nav>
      <button class="menu" type="button" aria-controls="primary-nav" aria-expanded="false" aria-label="メニューを開く"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
    </div>
  </header>
  <main class="hero" id="main">
    <div class="hero-media" aria-hidden="true">
      <img src="../../service/lp/images/mv-img.jpg" alt="">
      <video src="../../service/lp/images/mv.mp4" poster="../../service/lp/images/mv-img.jpg" autoplay muted loop playsinline preload="metadata" tabindex="-1"></video>
    </div>
    <div class="hero-inner">
      <div class="hero-identity">
        <img class="hero-logo" src="../../service/lp/secret-cover-white-designs/legacy-logo-centered.svg" alt="ZERO" width="153" height="156">
      </div>
      <p class="white-band" data-copy="sub" data-zero-font="bold">基礎から企画・制作・集客・改善まで。</p>
      <h1 class="headline" data-copy="main" data-zero-font="bold"><span class="headline-lead">ランディングページを、</span><span class="headline-actions"><em>知る。</em><em>つくる。</em><strong>育てる。</strong></span></h1>
      <p class="source" data-copy="source" data-zero-font="regular">2013年創業、LP制作を専門とする株式会社ZEROが届ける、実践の教科書。</p>
    </div>
  </main>
  <script>
    const header=document.querySelector('.header');
    const button=document.querySelector('.menu');
    button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く');header.classList.toggle('open',open)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&button.getAttribute('aria-expanded')==='true'){button.click();button.focus()}});
    const video=document.querySelector('.hero-media video');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    function syncVideo(){if(reduced.matches||document.hidden){video.pause();return}if(document.querySelector('.hero').getBoundingClientRect().bottom>0)video.play().catch(()=>{});else video.pause()}
    reduced.addEventListener('change',syncVideo);
    document.addEventListener('visibilitychange',syncVideo);
    if('IntersectionObserver'in window)new IntersectionObserver(syncVideo,{threshold:0}).observe(document.querySelector('.hero'));
    syncVideo();
  </script>
</body>
</html>
