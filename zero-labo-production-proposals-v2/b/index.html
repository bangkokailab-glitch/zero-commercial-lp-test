<!doctype html>
<html lang="ja">
<head>

<body>
  <header class="site-header">

        <img class="brand-mark" src="../../service/lp/images/logo-w.svg" width="50" height="50" alt="">
        <span data-zero-font="bold">ZEROラボ</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-controls="primary-nav" aria-expanded="false"><span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i></span><span class="menu-label">メニュー</span></button>
      <nav class="primary-nav" id="primary-nav" aria-label="メインナビゲーション">
        <a href="https://zero-s.jp/labo/">ホーム</a>
        <a href="https://zero-s.jp/labo/?cat=2">LPO対策</a>

  <main class="hero">
    <img class="art" src="kinetic-cut-paper.jpg" width="1690" height="931" alt="" aria-hidden="true" fetchpriority="high">
    <div class="hero-inner">
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1 data-zero-font="bold"><span class="intro"><span>ランディングページを、</span></span><span class="word know"><span>知る。</span></span><span class="word make"><span>つくる。</span></span><span class="word grow"><span>育てる。</span></span></h1>

      </div>
    </div>
    <div class="bottom-rule" aria-hidden="true"></div>
  </main>
  <script>
    const button=document.querySelector('.menu-toggle'),nav=document.querySelector('.primary-nav');
    button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く');nav.classList.toggle('open',open)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&button.getAttribute('aria-expanded')==='true'){button.click();button.focus()}});
  </script>
