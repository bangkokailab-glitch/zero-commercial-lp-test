<!doctype html>
<html lang="ja">
<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="https://zero-s.jp/labo/" aria-label="ZEROラボ ホーム"><img src="../../service/lp/images/logo-w.svg" alt="" width="75" height="71"><span data-zero-font="bold">ZEROラボ</span></a>
      <nav class="nav" id="primary-nav" aria-label="メインナビゲーション">
        <a href="https://zero-s.jp/labo/">ホーム</a>
        <a href="https://zero-s.jp/labo/?cat=2">LPO対策</a>
        <a href="https://zero-s.jp/labo/?cat=4">SEO対策</a>
        <a href="https://zero-s.jp/labo/?cat=3">メディア運営</a>
        <a href="https://zero-s.jp/labo/?page_id=7796">WEB用語集</a>
        <a class="contact" href="https://zero-s.jp/contact/"><svg viewBox="0 0 30 22" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="19" rx="1"/><path d="M3 3.5 15 13l12-9.5"/></svg>お問い合わせ</a>
      </nav>
      <button class="menu" type="button" aria-controls="primary-nav" aria-expanded="false" aria-label="メニューを開く"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
    </div>
  </header>
  <main class="hero" id="main">
    <div class="hero-art" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1 data-copy="main" data-zero-font="bold"><span class="intro-paper">ランディングページを、</span><span class="verbs"><span class="verb verb-know">知る。</span><span class="verb">つくる。</span><span class="verb verb-grow">育てる。</span></span></h1>
      <p class="sub" data-copy="sub" data-zero-font="bold">基礎から企画・制作・集客・改善まで。</p>
      <div class="circles" aria-hidden="true">
        <div class="circle"><svg viewBox="0 0 100 100"><path d="M19 66V22h49v44H19Zm8-34h27M27 41h33M27 51h18"/><circle cx="63" cy="60" r="16"/><path d="m75 72 13 13"/></svg></div>
        <div class="circle"><svg viewBox="0 0 100 100"><path d="M16 24h64v53H16zM16 36h64M26 46h20v23H26zM53 46h17M53 56h17M53 66h12"/><path d="M62 19v10M56 24h12"/></svg></div>
        <div class="circle"><svg viewBox="0 0 100 100"><path d="M19 75V23M19 75h66M29 64l16-17 13 8 25-28M76 27h7v7"/><circle cx="29" cy="64" r="2"/><circle cx="45" cy="47" r="2"/><circle cx="58" cy="55" r="2"/></svg></div>
      </div>
      <p class="source" data-copy="source" data-zero-font="regular">2013年創業、LP制作を専門とする株式会社ZEROが届ける、実践の教科書。</p>
    </div>
  </main>
  <script>
    const button=document.querySelector('.menu');
    button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く');document.querySelector('.header').classList.toggle('open',open)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&button.getAttribute('aria-expanded')==='true'){button.click();button.focus()}});
  </script>
</body>
</html>
