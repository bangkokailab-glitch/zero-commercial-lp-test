<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1040" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc">
  <title id="title">LPとLINEをつなぐ相談・予約の流れ</title>
  <desc id="desc">広告・SNSからLPを見て、LINEに登録し、自動案内を受け、相談・予約、来店・再来店につながる例</desc>
  <rect width="600" height="1040" rx="24" fill="#fbf6f0"/>
  <text x="300" y="55" fill="#132f55" font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif" font-size="28" font-weight="700" text-anchor="middle">LPを見た後も、関係をつなぐ</text>
  <text x="300" y="85" fill="#645c59" font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif" font-size="22" text-anchor="middle">相談から再来店までの例</text>
  <g font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif">
    <g transform="translate(54 119)"><rect width="492" height="122" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="55" cy="61" r="29" fill="#fe776e"/><text x="55" y="70" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">1</text><text x="111" y="54" fill="#132f55" font-size="25" font-weight="700">知る</text><text x="111" y="88" fill="#5a5452" font-size="24">SNS・広告</text></g>
    <g transform="translate(54 269)"><rect width="492" height="122" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="55" cy="61" r="29" fill="#fe776e"/><text x="55" y="70" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">2</text><text x="111" y="54" fill="#132f55" font-size="25" font-weight="700">理解する</text><text x="111" y="88" fill="#5a5452" font-size="24">LPで内容を確認</text></g>
    <g transform="translate(54 419)"><rect width="492" height="122" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="55" cy="61" r="29" fill="#fe776e"/><text x="55" y="70" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">3</text><text x="111" y="54" fill="#132f55" font-size="25" font-weight="700">LINE登録</text><text x="111" y="88" fill="#5a5452" font-size="24">接点を残す</text></g>
    <g transform="translate(54 569)"><rect width="492" height="122" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="55" cy="61" r="29" fill="#fe776e"/><text x="55" y="70" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">4</text><text x="111" y="54" fill="#132f55" font-size="25" font-weight="700">自動案内</text><text x="111" y="88" fill="#5a5452" font-size="24">疑問に答える</text></g>
    <g transform="translate(54 719)"><rect width="492" height="122" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="55" cy="61" r="29" fill="#fe776e"/><text x="55" y="70" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">5</text><text x="111" y="54" fill="#132f55" font-size="25" font-weight="700">相談・予約</text><text x="111" y="88" fill="#5a5452" font-size="24">空き枠を選ぶ</text></g>
    <g transform="translate(54 869)"><rect width="492" height="122" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="55" cy="61" r="29" fill="#fe776e"/><text x="55" y="70" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">6</text><text x="111" y="54" fill="#132f55" font-size="25" font-weight="700">来店・再来店</text><text x="111" y="88" fill="#5a5452" font-size="24">必要な時に案内</text></g>
  </g>
  <path d="M300 247v15m-7-7 7 7 7-7M300 397v15m-7-7 7 7 7-7M300 547v15m-7-7 7 7 7-7M300 697v15m-7-7 7 7 7-7M300 847v15m-7-7 7 7 7-7" fill="none" stroke="#fa7771" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
