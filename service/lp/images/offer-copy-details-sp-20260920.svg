<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">無料のLP構成案とデザイン案</title>
  <desc id="desc">STEP 1 無料でLP構成案をご提案。何をどの順番で伝えるのかを整理。STEP 2 無料でデザイン1案をご提案。ファーストビューのデザインとメインコピーを具体化。ZERO式LPの10の秘訣・料金・対応範囲まで読んでいただき、ヒアリングにご回答いただいた方には2つのご提案をご用意しています。</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151515"/><stop offset="1" stop-color="#0c0c0c" stop-opacity=".82"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#cb9634"/><stop offset=".48" stop-color="#fae59b"/><stop offset="1" stop-color="#e4b94e"/></linearGradient>
  </defs>
  <g font-family="Helvetica Neue, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
    <rect x="2" y="2" width="716" height="180" rx="12" fill="url(#card)" stroke="#efd675" stroke-width="4"/>
    <rect x="2" y="198" width="716" height="180" rx="12" fill="url(#card)" stroke="#efd675" stroke-width="4"/>
    <g text-anchor="middle">
      <rect x="301" y="19" width="118" height="36" rx="18" fill="url(#gold)"/><text x="360" y="37" dominant-baseline="middle" fill="#111" font-size="19" font-weight="800">STEP 1</text>
      <text x="360" y="104" fill="#fff" font-size="32" font-weight="800">無料で<tspan fill="#efd675">LP構成案</tspan>をご提案</text>
      <text x="360" y="151" fill="#fff" font-size="23" font-weight="600">何をどの順番で伝えるのかを整理</text>
    </g>
    <g text-anchor="middle">
      <rect x="301" y="215" width="118" height="36" rx="18" fill="url(#gold)"/><text x="360" y="233" dominant-baseline="middle" fill="#111" font-size="19" font-weight="800">STEP 2</text>
      <text x="360" y="300" fill="#fff" font-size="32" font-weight="800">無料で<tspan fill="#efd675">デザイン1案</tspan>をご提案</text>
      <text x="360" y="339" fill="#fff" font-size="22" font-weight="600">ファーストビューのデザインと</text>
      <text x="360" y="369" fill="#fff" font-size="22" font-weight="600">メインコピーを具体化</text>
    </g>
    <text x="360" y="426" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ZERO式LPの10の秘訣・料金・対応範囲まで</text>
    <text x="360" y="461" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">読んでいただき、ヒアリングにご回答いただいた方には</text>
    <text x="360" y="496" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2つのご提案をご用意しています</text>
  </g>
</svg>
