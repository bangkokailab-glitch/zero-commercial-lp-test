<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LPとLINEをつなぐ相談・予約の流れ</title>
  <desc id="desc">広告・SNSで知り、LPで理解し、LINEに登録して自動案内を受け、相談・予約、来店・再来店へ進む例</desc>
  <rect width="1200" height="360" rx="24" fill="#fbf6f0"/>
  <text x="40" y="59" fill="#132f55" font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif" font-size="30" font-weight="700">LPを見た後も、関係をつなぐ</text>
  <text x="41" y="88" fill="#645c59" font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif" font-size="17">来店型サービスを想定した、相談から再来店までの例</text>
  <g font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif" text-anchor="middle">
    <g transform="translate(36 127)"><rect width="170" height="165" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="85" cy="39" r="22" fill="#fe776e"/><text x="85" y="47" fill="#fff" font-size="22" font-weight="700">1</text><text x="85" y="93" fill="#132f55" font-size="22" font-weight="700">知る</text><text x="85" y="125" fill="#5a5452" font-size="16">SNS・広告</text></g>
    <g transform="translate(232 127)"><rect width="170" height="165" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="85" cy="39" r="22" fill="#fe776e"/><text x="85" y="47" fill="#fff" font-size="22" font-weight="700">2</text><text x="85" y="93" fill="#132f55" font-size="22" font-weight="700">理解する</text><text x="85" y="125" fill="#5a5452" font-size="16">LPで内容を確認</text></g>
    <g transform="translate(428 127)"><rect width="170" height="165" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="85" cy="39" r="22" fill="#fe776e"/><text x="85" y="47" fill="#fff" font-size="22" font-weight="700">3</text><text x="85" y="93" fill="#132f55" font-size="22" font-weight="700">LINE登録</text><text x="85" y="125" fill="#5a5452" font-size="16">接点を残す</text></g>
    <g transform="translate(624 127)"><rect width="170" height="165" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="85" cy="39" r="22" fill="#fe776e"/><text x="85" y="47" fill="#fff" font-size="22" font-weight="700">4</text><text x="85" y="93" fill="#132f55" font-size="22" font-weight="700">自動案内</text><text x="85" y="125" fill="#5a5452" font-size="16">疑問に答える</text></g>
    <g transform="translate(820 127)"><rect width="170" height="165" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="85" cy="39" r="22" fill="#fe776e"/><text x="85" y="47" fill="#fff" font-size="22" font-weight="700">5</text><text x="85" y="93" fill="#132f55" font-size="22" font-weight="700">相談・予約</text><text x="85" y="125" fill="#5a5452" font-size="16">空き枠を選ぶ</text></g>
    <g transform="translate(1016 127)"><rect width="170" height="165" rx="16" fill="#fff" stroke="#eadbd6" stroke-width="2"/><circle cx="85" cy="39" r="22" fill="#fe776e"/><text x="85" y="47" fill="#fff" font-size="22" font-weight="700">6</text><text x="85" y="93" fill="#132f55" font-size="22" font-weight="700">来店・再来店</text><text x="85" y="125" fill="#5a5452" font-size="16">必要な時に案内</text></g>
  </g>
  <path d="m211 209 14 0m-6-6 6 6-6 6M407 209h14m-6-6 6 6-6 6M603 209h14m-6-6 6 6-6 6M799 209h14m-6-6 6 6-6 6M995 209h14m-6-6 6 6-6 6" fill="none" stroke="#fa7771" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="331" fill="#4e6171" font-family="Hiragino Kaku Gothic ProN,Noto Sans JP,sans-serif" font-size="17" text-anchor="middle">自動案内・カレンダー連携・リマインドは、必要に応じて組み合わせます。</text>
</svg>
