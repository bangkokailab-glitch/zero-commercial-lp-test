<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc">
  <title id="title">無料のLP構成案とデザイン案</title>
  <desc id="desc">STEP 1 無料でLP構成案をご提案。何をどの順番で伝えるのかを整理。STEP 2 無料でデザイン1案をご提案。ファーストビューのデザインとメインコピーを具体化。ZERO式LPの10の秘訣・料金・対応範囲まで読んでいただき、ヒアリングにご回答いただいた方には2つのご提案をご用意しています。</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151515"/><stop offset="1" stop-color="#0c0c0c" stop-opacity=".8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#cb9634"/><stop offset=".48" stop-color="#fae59b"/><stop offset="1" stop-color="#e4b94e"/></linearGradient>
  </defs>
  <g font-family="Helvetica Neue, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
    <rect x="1.5" y="1.5" width="483" height="174" rx="10" fill="url(#card)" stroke="#efd675" stroke-width="3"/>
    <rect x="515.5" y="1.5" width="483" height="174" rx="10" fill="url(#card)" stroke="#efd675" stroke-width="3"/>
    <g text-anchor="middle">
      <rect x="190" y="20" width="106" height="31" rx="15.5" fill="url(#gold)"/><text x="243" y="35.5" dominant-baseline="middle" fill="#111" font-size="16" font-weight="800">STEP 1</text>
      <text x="243" y="96" fill="#fff" font-size="29" font-weight="800">無料で<tspan fill="#efd675">LP構成案</tspan>をご提案</text>
      <text x="243" y="143" fill="#fff" font-size="19" font-weight="600">何をどの順番で伝えるのかを整理</text>
    </g>
    <g text-anchor="middle">
      <rect x="704" y="20" width="106" height="31" rx="15.5" fill="url(#gold)"/><text x="757" y="35.5" dominant-baseline="middle" fill="#111" font-size="16" font-weight="800">STEP 2</text>
      <text x="757" y="96" fill="#fff" font-size="29" font-weight="800">無料で<tspan fill="#efd675">デザイン1案</tspan>をご提案</text>
      <text x="757" y="130" fill="#fff" font-size="18" font-weight="600">ファーストビューのデザインと</text>
      <text x="757" y="157" fill="#fff" font-size="18" font-weight="600">メインコピーを具体化</text>
    </g>
    <text x="500" y="222" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">ZERO式LPの10の秘訣・料金・対応範囲まで読んでいただき、</text>
    <text x="500" y="254" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">ヒアリングにご回答いただいた方には2つのご提案をご用意しています</text>
  </g>
</svg>
