<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>秘訣9 改訂図02</title><link rel="stylesheet" href="https://morisawafonts.net/c/01M4BM2NTN3DGZBTPFB0NSJDMZ/mf.css"><link rel="stylesheet" href="figures-v3.css?v=20261010-v3"><link rel="stylesheet" href="crop-geometry.css?v=20261010-v3"><script>if(new URLSearchParams(location.search).get('export')==='2')document.documentElement.classList.add('export2x');</script></head><body><main class="diagram figure-02"><header class="figure-head"><span>図 02</span><h1>訴求の違う3つのLPで、反応を確かめる。</h1><p>同じサービスの、何を先に伝えるか。</p></header><div class="axes-grid"><section class="axis-case"><header><h2><span>A案</span>便利さ</h2><p>重たい布団を運ばずに。</p><small>利用の流れを先に伝える。</small></header><img src="renders/lp-a.jpg" width="780" height="6781" alt="生成した便利さ訴求の完成LP。FV、本文、料金、FAQ、CTAを含む"></section><section class="axis-case"><header><h2><span>B案</span>清潔さ</h2><p>家では洗いにくい布団を洗う。</p><small>洗浄と仕上がりを先に伝える。</small></header><img src="renders/lp-b.jpg" width="780" height="6920" alt="生成した清潔さ訴求の完成LP。FV、本文、料金、FAQ、CTAを含む"></section><section class="axis-case"><header><h2><span>C案</span>家族での利用</h2><p>家族の布団をまとめて頼む。</p><small>一緒に利用する場面を先に伝える。</small></header><img src="renders/lp-c.jpg" width="780" height="6581" alt="生成した家族での利用訴求の完成LP。FV、本文、料金、FAQ、CTAを含む"></section></div><p class="conditions"><b>基本条件は共通</b>商品・料金・申し込み条件をそろえる</p><p class="summary flow"><span>比較する</span><i>→</i><span>有望な方向性を絞る</span><i>→</i><span>さらに改善する</span></p><p class="note">説明用の架空サービス・デザイン例</p></main><script src="font-audit.js?v=20261010-v3"></script></body></html>
