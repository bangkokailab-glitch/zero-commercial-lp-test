   <ul class="news-grid news-archive-list" id="news-results"><li><button type="button" class="news-card" data-article="17"><span class="news-image"><img src="/zero-commercial-lp-test/zero-labo-media/assets/strategy-research.png" width="1536" height="1024" loading="lazy" alt=""></span><span class="news-copy"><span class="news-meta"><span class="news-date">公開準備中</span><span class="news-category">企画</span></span><span class="news-title">LP制作に必要な顧客情報の集め方</span><span class="news-excerpt">誰に何を伝えるかを決めるために、必要な顧客情報を整理。相談記録や購入理由など、LP制作に役立つ情報の集め方を紹介します。</span><span class="news-tags"><span>#調査</span></span></span></button></li><li><button type="button" class="news-card" data-article="46"><span class="news-image"><img src="/zero-commercial-lp-test/zero-labo-media/assets/copy-design-build.png" width="1536" height="1024" loading="lazy" alt=""></span><span class="news-copy"><span class="news-meta"><span class="news-date">公開準備中</span><span class="news-category">制作</span></span><span class="news-title">スマホで読みやすいLPのデザイン</span><span class="news-excerpt">スマートフォンで無理なく読める文字、余白、画像の見せ方を整理。読みやすさと操作のしやすさを確認する視点を紹介します。</span><span class="news-tags"><span>#デザイン</span></span></span></button></li><li><button type="button" class="news-card" data-article="20"><span class="news-image"><img src="/zero-commercial-lp-test/zero-labo-media/assets/strategy-research.png" width="1536" height="1024" loading="lazy" alt=""></span><span class="news-copy"><span class="news-meta"><span class="news-date">公開準備中</span><span class="news-category">企画</span></span><span class="news-title">競合LPと広告の調べ方・比較表の作り方</span><span class="news-excerpt">競合のLPと広告を見る際の比較項目を整理。対象顧客、提案、根拠、申込み条件を並べ、自社の方針を考える材料を集めます。</span><span class="news-tags"><span>#調査</span><span>#広告</span></span></span></button></li><li><button type="button" class="news-card" data-article="49"><span class="news-image"><img src="/zero-commercial-lp-test/zero-labo-media/assets/copy-design-build.png" width="1536" height="1024" loading="lazy" alt=""></span><span class=
